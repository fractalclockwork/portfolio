<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Brent A. Thorne — Embedded Systems Engineer, Scientific Computing Specialist, and R&D Platform Architect. Firmware, real-time sensing, HPC, and applied AI." />

    <!-- Open Graph -->
    <meta property="og:title" content="{{ page.title | default: site.title }}" />
    <meta property="og:description" content="Embedded Systems Engineer — Firmware, real-time sensing, HPC, and applied AI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ '/assets/img/headshot_circle.png' | absolute_url }}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
    <meta name="twitter:description" content="Embedded Systems Engineer — Firmware, real-time sensing, HPC, and applied AI." />
    <meta name="twitter:image" content="{{ '/assets/img/headshot_circle.png' | absolute_url }}" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ '/assets/img/headshot_circle.png' | relative_url }}" />

    <!-- Theme CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}" />
  </head>
  <body>

    <div class="wrapper">
      <header>
        <h1>{{ site.title }}</h1>
        {% if site.logo %}
        <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" />
        {% endif %}
      </header>

      <nav class="site-nav">
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#education">Education</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </nav>

      <main>
        {{ content }}
      </main>

      <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
      </footer>
    </div>

    <!-- Mermaid.js — rewrite kramdown's <code class="language-mermaid"> to <pre class="mermaid"> -->
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      document.querySelectorAll('code.language-mermaid').forEach(codeEl => {
        const pre = codeEl.parentElement;
        const mermaidPre = document.createElement('pre');
        mermaidPre.classList.add('mermaid');
        mermaidPre.textContent = codeEl.textContent;
        pre.parentElement.replaceChild(mermaidPre, pre);
      });
      mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    </script>

  </body>
</html>
