<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">tftp-boot-docker topology</title>
  <desc id="desc">Containerized UEFI PXE netboot infrastructure combining OpenWrt DHCP next-server routing with Dockerized TFTP and HTTP servers for diskless Ubuntu LTS lab provisioning.</desc>
  <defs>
    <pattern id="grid-pxe" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#3dcfbf" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="arrow-cyan-pxe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#3dcfbf"/>
    </marker>
  </defs>

  <rect width="800" height="220" fill="#070b12"/>
  <rect width="800" height="220" fill="url(#grid-pxe)"/>

  <text x="24" y="26" fill="#c4a574" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="2">
    TOPOLOGY // CONTAINERIZED UEFI PXE NETBOOT INFRASTRUCTURE
  </text>
  <line x1="24" y1="36" x2="776" y2="36" stroke="#3dcfbf" stroke-opacity="0.18" stroke-width="1"/>

  <g transform="translate(24, 54)">
    <rect width="158" height="142" rx="4" fill="#0e1520" stroke="#3dcfbf" stroke-opacity="0.28" stroke-width="1"/>
    <text x="14" y="22" fill="#c4a574" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5">01 / LAN DHCP</text>
    <text x="14" y="46" fill="#e4eaf2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">OpenWrt Router</text>
    <text x="14" y="66" fill="#8a96a8" font-family="ui-monospace, monospace" font-size="10">- DHCP offer lease</text>
    <text x="14" y="84" fill="#8a96a8" font-family="ui-monospace, monospace" font-size="10">- next-server IP</text>
    <text x="14" y="102" fill="#8a96a8" font-family="ui-monospace, monospace" font-size="10">- bootx64.efi path</text>
    <rect x="14" y="112" width="130" height="18" rx="2" fill="#121a26" stroke="#3dcfbf" stroke-opacity="0.25"/>
    <text x="20" y="124" fill="#3dcfbf" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">PXE DISCOVERY</text>
  </g>

  <line x1="182" y1="125" x2="216" y2="125" stroke="#3dcfbf" stroke-width="1.5" marker-end="url(#arrow-cyan-pxe)"/>

  <g transform="translate(222, 54)">
    <rect width="172" height="142" rx="4" fill="#0e1520" stroke="#3dcfbf" stroke-opacity="0.55" stroke-width="1.25"/>
    <text x="14" y="22" fill="#3dcfbf" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5">02 / DOCKER NETBOOT</text>
    <rect x="14" y="34" width="144" height="28" rx="3" fill="#121a26" stroke="#3dcfbf" stroke-opacity="0.2"/>
    <text x="22" y="52" fill="#e4eaf2" font-family="ui-monospace, monospace" font-size="10">tftpd-hpa (UDP :69)</text>
    <rect x="14" y="68" width="144" height="28" rx="3" fill="#121a26" stroke="#3dcfbf" stroke-opacity="0.2"/>
    <text x="22" y="86" fill="#e4eaf2" font-family="ui-monospace, monospace" font-size="10">HTTP ISO Server</text>
    <rect x="14" y="102" width="144" height="28" rx="3" fill="#121a26" stroke="#3dcfbf" stroke-opacity="0.2"/>
    <text x="22" y="120" fill="#e4eaf2" font-family="ui-monospace, monospace" font-size="10">Ubuntu LTS Payload</text>
  </g>

  <line x1="394" y1="125" x2="428" y2="125" stroke="#3dcfbf" stroke-width="1.5" marker-end="url(#arrow-cyan-pxe)"/>

  <g transform="translate(434, 54)">
    <rect width="162" height="142" rx="4" fill="#0e1520" stroke="#3dcfbf" stroke-opacity="0.28" stroke-width="1"/>
    <text x="14" y="22" fill="#c4a574" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5">03 / UEFI BOOT STAGE</text>
    <text x="14" y="46" fill="#e4eaf2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">GRUB EFI Chain</text>
    <text x="14" y="66" fill="#8a96a8" font-family="ui-monospace, monospace" font-size="10">- TFTP GRUB config</text>
    <text x="14" y="84" fill="#8a96a8" font-family="ui-monospace, monospace" font-size="10">- vmlinuz + initrd</text>
    <text x="14" y="102" fill="#8a96a8" font-family="ui-monospace, monospace" font-size="10">- HTTP squashfs root</text>
    <rect x="14" y="112" width="134" height="18" rx="2" fill="#14202e"/>
    <text x="20" y="124" fill="#7aefe0" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">FAST HTTP FETCH</text>
  </g>

  <line x1="596" y1="125" x2="630" y2="125" stroke="#3dcfbf" stroke-width="1.5" marker-end="url(#arrow-cyan-pxe)"/>

  <g transform="translate(636, 54)">
    <rect width="140" height="142" rx="4" fill="#0e1520" stroke="#c4a574" stroke-opacity="0.45" stroke-width="1"/>
    <text x="12" y="22" fill="#c4a574" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5">04 / LAB TARGETS</text>
    <text x="12" y="46" fill="#e4eaf2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Bench Provision</text>
    <text x="12" y="66" fill="#8a96a8" font-family="ui-monospace, monospace" font-size="10">- Diskless live boot</text>
    <text x="12" y="84" fill="#8a96a8" font-family="ui-monospace, monospace" font-size="10">- Bare-metal install</text>
    <text x="12" y="102" fill="#8a96a8" font-family="ui-monospace, monospace" font-size="10">- Repeatable images</text>
    <rect x="12" y="112" width="116" height="18" rx="2" fill="#14202e"/>
    <text x="20" y="124" fill="#3dcfbf" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">BENCH INFRA</text>
  </g>
</svg>
